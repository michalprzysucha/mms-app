plugins {
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'org.example'
version = findProperty('appVersion') ?: '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    jarAgent
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok:1.18.48'

    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    jarAgent 'com.microsoft.azure:applicationinsights-agent:3.7.9'

    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'mms-app.jar'
}

tasks.register('copyJarAgent', Copy) {
    from configurations.jarAgent
    into layout.buildDirectory.dir('application-insights')
    rename {'applicationinsights-agent.jar'}
}

build.dependsOn copyJarAgent