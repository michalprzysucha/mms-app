name: Trigger auto deployment for mms-container

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/mms-container-AutoDeployTrigger-1d7c2bef-e951-4bf5-8352-efb7331a9ee0.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MMSCONTAINER_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MMSCONTAINER_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MMSCONTAINER_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.MMSCONTAINER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MMSCONTAINER_REGISTRY_PASSWORD }}
          containerAppName: mms-container
          resourceGroup: rg-prod-polandcentral-mms
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


